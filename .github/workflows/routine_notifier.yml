name: Class Routine Automation Notifier

on:
  schedule:
    - cron: '*/5 * * * *' # Runs every 5 minutes automatically
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  check-routine:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v3

    - name: Set up Java JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Compile Java Application
      run: javac src/RoutineManager.java src/NotificationService.java

    - name: Execute Notification Checker
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: java src.RoutineManager check-notifications
